name: Aggiorna quotazioni Fantacalcio

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-quotazioni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Update workbook and players.json
        env:
          FANTACALCIO_COOKIE: ${{ secrets.FANTACALCIO_COOKIE }}
        run: python aggiorna_quotazioni.py --config config.github.json

      - name: Commit updated data
        shell: bash
        run: |
          git add -- "players.json"

          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: aggiorna quotazioni e catalogo giocatori"
            git push
          fi

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html players.json _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
