name: Aggiorna quotazioni Fantacalcio

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-quotazioni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update workbook
        env:
          FANTACALCIO_COOKIE: ${{ secrets.FANTACALCIO_COOKIE }}
        run: python aggiorna_quotazioni.py --config config.github.json

      - name: Commit updated workbook
        shell: bash
        run: |
          git add -- "Quotazioni_Fantacalcio_Stagione_2026_27.xlsx"

          if git diff --cached --quiet; then
            echo "Nessuna variazione nelle quotazioni."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: aggiorna quotazioni Fantacalcio"
          git push
