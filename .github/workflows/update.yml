name: Aggiorna dati Fantacalcio

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**/*.py"
      - "config.github.json"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-catalogo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.catalog.outputs.changed }}
      ref: ${{ steps.catalog.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for optional Understat scraping
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Update public/players.json
        env:
          FANTACALCIO_COOKIE: ${{ secrets.FANTACALCIO_COOKIE }}
        run: python scripts/aggiorna_quotazioni.py --config config.github.json

      - name: Commit catalog when changed
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/players.json

          if git diff --cached --quiet; then
            echo "Nessuna variazione nel catalogo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): aggiorna catalogo giocatori"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-updated-catalog:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.ref }}